<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inicio · Yza</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <main class="stage">
      <section class="glass">
        <div class="logo">Yza</div>
        <h1>Bienvenido</h1>
        <p class="datos"><strong>{{ u.nombre }}</strong></p>
        <p class="datos">Perfil: {{ u.rol or "Sin perfil asignado" }}</p>
        <p class="datos">Sucursal: {{ u.sucursal }}</p>
        <a href="{{ url_for('logout') }}" class="btn salir">Cerrar sesión</a>
      </section>
    </main>
  </body>
</html>

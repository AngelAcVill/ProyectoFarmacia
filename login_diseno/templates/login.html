<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Farmacia Yza</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <!-- Fondo decorativo -->
    <div class="scene" aria-hidden="true">
      <span class="orb orb-1"></span>
      <span class="orb orb-2"></span>
      <span class="orb orb-3"></span>
      <span class="pill pill-1"></span>
      <span class="pill pill-2"></span>
      <span class="pill pill-3"></span>
    </div>

    <main class="stage">
      <form class="glass" action="{{ url_for('login') }}" method="post">
        <div class="logo">Farmacia Yza</div>
        <h1>Iniciar sesión</h1>
        {% with mensajes = get_flashed_messages(with_categories=true) %} {% for
        categoria, mensaje in mensajes %}
        <div class="alert {{ categoria }}">{{ mensaje }}</div>
        {% endfor %} {% endwith %}

        <div class="field">
          <label for="usuario">Usuario</label>
          <input
            id="usuario"
            name="usuario"
            type="text"
            placeholder="usuario"
            autocomplete="off"
          />
        </div>

        <div class="field">
          <label for="clave">Contraseña</label>
          <div class="pass">
            <input
              id="clave"
              name="clave"
              type="password"
              placeholder="Contraseña"
            />
            <button
              type="button"
              class="eye"
              id="ver"
              aria-label="Mostrar contraseña"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M12 5C6.5 5 2.7 9 1.5 12c1.2 3 5 7 10.5 7s9.3-4 10.5-7C21.3 9 17.5 5 12 5Zm0 11.5a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9Zm0-7a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5Z"
                />
              </svg>
            </button>
          </div>
        </div>

        <a href="#" class="forgot">¿Olvidaste tu contraseña?</a>

        <button type="submit" class="btn">Entrar</button>
      </form>
    </main>

    <script>
      // Solo visual: mostrar / ocultar el texto del campo
      const campo = document.getElementById("clave");
      document.getElementById("ver").addEventListener("click", () => {
        campo.type = campo.type === "password" ? "text" : "password";
      });
    </script>
  </body>
</html>
